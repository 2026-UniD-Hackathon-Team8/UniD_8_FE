<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200" aria-label="탐정형">
<!-- 탐정형 · 다믿어? 수사 일지 캐릭터 모션 -->
<style>.det-bl{animation:det-bl 3s linear infinite}
@keyframes det-bl{0%,80%{transform:scaleY(1)}82%{transform:scaleY(.12)}84%,100%{transform:scaleY(1)}}
.det-hp{animation:det-hp 1.5s cubic-bezier(.4,0,.3,1) infinite}
@keyframes det-hp{0%,60%,100%{transform:translateY(0)}20%{transform:translateY(-4px)}35%{transform:translateY(0)}}
.det-ht{animation:det-ht 1.5s cubic-bezier(.4,0,.3,1) infinite;transform-origin:50px 28px}
@keyframes det-ht{0%,60%,100%{transform:translateY(0) rotate(0)}22%{transform:translateY(-2px) rotate(-6deg)}38%{transform:translateY(0) rotate(0)}}
.det-ar{animation:det-ar 1.5s cubic-bezier(.4,0,.3,1) infinite;transform-origin:58px 53px}
@keyframes det-ar{0%,60%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}35%{transform:rotate(6deg)}48%{transform:rotate(-3deg)}}
.det-st{animation:det-st 1.5s ease-out infinite;transform-origin:88px 19px}
@keyframes det-st{0%,15%{transform:scale(.4) rotate(0);opacity:0}30%{transform:scale(1.35) rotate(60deg);opacity:1}60%,100%{transform:scale(.8) rotate(90deg);opacity:.0}}</style>
<g class="det-hp"><rect x="41" y="28" width="18" height="44" rx="9" fill="#E0A51A" transform="translate(2.5 2.5)"/><rect x="41" y="28" width="18" height="44" rx="9" fill="#FFC83D"/>
<g class="det-ht"><path d="M34 27c0-14 32-14 32 0z" fill="#232326"/><rect x="34" y="22" width="32" height="5" fill="#3a3a3f"/><ellipse cx="50" cy="28" rx="23" ry="4.6" fill="#1b1b1d"/></g>
<g class="det-bl" style="transform-origin:46px 42px"><circle cx="46" cy="42" r="3.6" fill="#fff"/><g class="det-pu"><circle cx="46.8" cy="42.6" r="1.728" fill="#141414"/></g></g><g class="det-bl" style="transform-origin:54px 42px"><circle cx="54" cy="42" r="3.6" fill="#fff"/><g class="det-pu"><circle cx="54.8" cy="42.6" r="1.728" fill="#141414"/></g></g><path d="M46 52q4 3 8 0" stroke="#141414" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<g class="det-ar"><path d="M58 52L73 35" stroke="#141414" stroke-width="6" stroke-linecap="round"/><path d="M58 54L73 37" stroke="#3a3a3f" stroke-width="2" stroke-linecap="round" opacity=".6"/>
<circle cx="79" cy="28" r="8.5" fill="rgba(255,255,255,.4)" stroke="#141414" stroke-width="3"/>
<g class="det-st"><path d="M88 14l1.6 3.8 3.8 1.6-3.8 1.6-1.6 3.8-1.6-3.8-3.8-1.6 3.8-1.6z" fill="#f3f1ea"/></g></g></g>
<circle cx="52.5" cy="87.5" r="8.5" fill="#E0A51A"/><circle cx="50" cy="85" r="8.5" fill="#FFC83D"/>
</svg>
